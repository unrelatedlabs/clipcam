<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 675" width="1200" height="675" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>ClipCam: take a photo on your iPhone, paste it on your Mac via Universal Clipboard</title>
  <defs>
    <!-- The photographed subject: a potted plant on a table -->
    <symbol id="scene" viewBox="0 0 120 120" preserveAspectRatio="xMidYMid slice">
      <rect width="120" height="120" fill="#ebe2d0"/>
      <rect y="84" width="120" height="36" fill="#c99e74"/>
      <rect y="84" width="120" height="3" fill="#b88c62"/>
      <rect x="18" y="20" width="26" height="34" rx="2" fill="#f7f1e4" stroke="#d8ccb5"/>
      <circle cx="31" cy="37" r="7" fill="#ffcc33"/>
      <ellipse cx="60" cy="92" rx="24" ry="3" fill="#a87e56" opacity=".6"/>
      <path d="M60 68 C 52 56, 38 50, 34 36 C 46 38, 56 48, 60 64 Z" fill="#3f8f5a"/>
      <path d="M60 68 C 68 56, 82 50, 86 36 C 74 38, 64 48, 60 64 Z" fill="#4fa06a"/>
      <path d="M60 66 C 54 52, 54 36, 60 24 C 66 36, 66 52, 60 66 Z" fill="#5fb07a"/>
      <path d="M60 70 C 50 64, 40 64, 30 58 C 40 54, 52 58, 60 68 Z" fill="#4fa06a"/>
      <path d="M60 70 C 70 64, 80 64, 90 58 C 80 54, 68 58, 60 68 Z" fill="#3f8f5a"/>
      <path d="M44 66 H76 L71 92 H49 Z" fill="#d9774b"/>
      <rect x="42" y="64" width="36" height="7" rx="2" fill="#e58a5e"/>
    </symbol>
    <clipPath id="screen"><rect x="10" y="10" width="210" height="430" rx="28"/></clipPath>
    <clipPath id="thumb"><rect x="34" y="377" width="36" height="36" rx="8"/></clipPath>
    <clipPath id="pasted"><rect x="58" y="112" width="132" height="132" rx="6"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dy="6" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#a39d90"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#f6f3ec"/>
  <g transform="translate(0 18)">

  <!-- Phone -->
  <g transform="translate(120 50)">
    <rect width="230" height="450" rx="36" fill="#111214" filter="url(#shadow)"/>
    <g clip-path="url(#screen)">
      <rect x="10" y="10" width="210" height="430" fill="#000"/>
      <use href="#scene" xlink:href="#scene" x="-55" y="10" width="340" height="340"/>
      <!-- lens pills -->
      <rect x="69" y="312" width="92" height="28" rx="14" fill="#000" opacity=".4"/>
      <circle cx="87" cy="326" r="11" fill="#1e1e20" opacity=".75"/>
      <text x="87" y="330" font-size="9" font-weight="600" fill="#f4f1ea" text-anchor="middle">.5×</text>
      <circle cx="115" cy="326" r="11" fill="#1e1e20"/>
      <text x="115" y="330" font-size="9" font-weight="700" fill="#ffcc33" text-anchor="middle">1×</text>
      <circle cx="143" cy="326" r="11" fill="#1e1e20" opacity=".75"/>
      <text x="143" y="330" font-size="9" font-weight="600" fill="#f4f1ea" text-anchor="middle">2×</text>
      <!-- toast -->
      <rect x="52" y="34" width="126" height="28" rx="14" fill="#141416" opacity=".88"/>
      <text x="115" y="52" font-size="12" font-weight="600" fill="#f4f1ea" text-anchor="middle"><tspan fill="#ffcc33">✓</tspan> Copied</text>
      <!-- controls -->
      <rect x="10" y="350" width="210" height="90" fill="#111214"/>
      <use href="#scene" xlink:href="#scene" x="34" y="377" width="36" height="36" clip-path="url(#thumb)"/>
      <circle cx="190" cy="395" r="18" fill="#1c1d20"/>
      <path d="M181 390h4l2-3h6l2 3h4v10h-18z" fill="none" stroke="#f4f1ea" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    <circle cx="115" cy="395" r="46" fill="none" stroke="#ffcc33" stroke-width="2" opacity=".35"/>
    <circle cx="115" cy="395" r="36" fill="none" stroke="#ffcc33" stroke-width="2.5" opacity=".9"/>
    <circle cx="115" cy="395" r="26" fill="none" stroke="#f4f1ea" stroke-width="4"/>
    <circle cx="115" cy="395" r="19" fill="#ffcc33"/>
  </g>

  <!-- Transfer -->
  <path d="M380 270 C 450 150, 560 150, 630 250" fill="none" stroke="#a39d90" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g transform="translate(462 132) rotate(-7)" filter="url(#shadow)">
    <rect width="86" height="98" rx="4" fill="#fff"/>
    <use href="#scene" xlink:href="#scene" x="7" y="7" width="72" height="72"/>
  </g>
  <path transform="translate(505 302)" d="M-18 14 H18 A11 11 0 0 0 17 -8 A16 16 0 0 0 -14 -8 A11 11 0 0 0 -18 14 Z" fill="none" stroke="#6b675f" stroke-width="3" stroke-linejoin="round"/>
  <text x="505" y="350" font-size="15" fill="#6b675f" text-anchor="middle">Universal Clipboard</text>

  <!-- Mac -->
  <g transform="translate(650 120)">
    <rect width="480" height="310" rx="16" fill="#1b1c1f" filter="url(#shadow)"/>
    <rect x="12" y="12" width="456" height="286" rx="6" fill="#dfe6ee"/>
    <rect x="12" y="12" width="456" height="16" fill="#fff" opacity=".65"/>
    <path d="M24 16 h6 M36 16 h18 M60 16 h18 M84 16 h18" stroke="#555" stroke-width="2" opacity=".5"/>
    <!-- window -->
    <g filter="url(#shadow)">
      <rect x="40" y="44" width="262" height="230" rx="10" fill="#fff"/>
    </g>
    <path d="M40 54 a10 10 0 0 1 10 -10 h242 a10 10 0 0 1 10 10 v16 h-262 z" fill="#f1f1f3"/>
    <circle cx="56" cy="57" r="5" fill="#ff5f57"/>
    <circle cx="72" cy="57" r="5" fill="#febc2e"/>
    <circle cx="88" cy="57" r="5" fill="#28c840"/>
    <text x="171" y="61" font-size="11" font-weight="600" fill="#555" text-anchor="middle">Notes</text>
    <rect x="58" y="84" width="150" height="7" rx="3.5" fill="#d6d8dc"/>
    <rect x="58" y="97" width="104" height="7" rx="3.5" fill="#d6d8dc"/>
    <use href="#scene" xlink:href="#scene" x="58" y="112" width="132" height="132" clip-path="url(#pasted)"/>
    <rect x="196" y="226" width="2" height="18" fill="#1a73e8"/>
    <!-- ⌘V keys -->
    <g filter="url(#shadow)">
      <rect x="326" y="176" width="54" height="54" rx="11" fill="#fff" stroke="#cfd2d8"/>
      <rect x="390" y="176" width="54" height="54" rx="11" fill="#fff" stroke="#cfd2d8"/>
    </g>
    <text x="353" y="212" font-size="26" fill="#222" text-anchor="middle">⌘</text>
    <text x="417" y="212" font-size="24" font-weight="600" fill="#222" text-anchor="middle">V</text>
    <!-- base -->
    <path d="M-34 310 H514 L496 328 Q488 336 474 336 H6 Q-8 336 -16 328 Z" fill="#c9ccd2"/>
    <rect x="205" y="310" width="70" height="6" rx="3" fill="#a9adb4"/>
  </g>

  </g>

  <!-- Steps -->
  <g font-size="15" fill="#6b675f">
    <g transform="translate(120 606)">
      <circle cx="14" cy="-7" r="14" fill="#111214"/>
      <text x="14" y="-2" font-size="14" font-weight="700" fill="#ffcc33" text-anchor="middle">1</text>
      <text x="38" y="0" font-size="21" font-weight="700" fill="#111214">Take a photo</text>
      <text x="38" y="26">It lands on your iPhone clipboard</text>
    </g>
    <g transform="translate(445 606)">
      <circle cx="14" cy="-7" r="14" fill="#111214"/>
      <text x="14" y="-2" font-size="14" font-weight="700" fill="#ffcc33" text-anchor="middle">2</text>
      <text x="38" y="0" font-size="21" font-weight="700" fill="#111214">Synced to your Mac</text>
      <text x="38" y="26">Handoff, same Apple ID</text>
    </g>
    <g transform="translate(805 606)">
      <circle cx="14" cy="-7" r="14" fill="#111214"/>
      <text x="14" y="-2" font-size="14" font-weight="700" fill="#ffcc33" text-anchor="middle">3</text>
      <text x="38" y="0" font-size="21" font-weight="700" fill="#111214">Paste anywhere</text>
      <text x="38" y="26">Just ⌘V, no app on the Mac</text>
    </g>
  </g>
</svg>
